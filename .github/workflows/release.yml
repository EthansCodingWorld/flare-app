name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"   # triggers on v1.2.3 tags

jobs:
  build:
    permissions:
      contents: write   # needed to create GitHub releases

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin    # Apple Silicon
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Linux system deps (WebKit, etc.)
      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install npm deps
        run: npm install

      # Import the Tauri signing key from repo secret
      - name: Import signing key
        shell: bash
        run: |
          echo "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" > tauri_private_key
          echo "TAURI_SIGNING_PRIVATE_KEY_PATH=$(pwd)/tauri_private_key" >> $GITHUB_ENV
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Flare ${{ github.ref_name }}"
          releaseBody: |
            ## What's new

            See the full changelog below.

            ---
            **Auto-update:** If you already have Flare installed, it will prompt you to update automatically.
            **Fresh install:** Download the installer for your platform below.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Cleanup signing key
        if: always()
        shell: bash
        run: rm -f tauri_private_key

  # After all platform builds succeed, generate the latest.json update manifest
  publish-manifest:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download release assets
        uses: robinraju/release-downloader@v1.9
        with:
          tag: ${{ github.ref_name }}
          fileName: "*.sig"
          out-file-path: sigs

      - name: Generate latest.json
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"   # strip leading 'v'
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REPO="${{ github.repository }}"
          BASE="https://github.com/${REPO}/releases/download/${{ github.ref_name }}"

          # Read signatures written by tauri-action
          read_sig() { cat "sigs/$1" 2>/dev/null || echo ""; }

          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "See https://github.com/${REPO}/releases/tag/${{ github.ref_name }} for details.",
            "pub_date": "${DATE}",
            "platforms": {
              "darwin-x86_64": {
                "signature": "$(read_sig "Flare_${VERSION}_x64.app.tar.gz.sig")",
                "url": "${BASE}/Flare_${VERSION}_x64.app.tar.gz"
              },
              "darwin-aarch64": {
                "signature": "$(read_sig "Flare_${VERSION}_aarch64.app.tar.gz.sig")",
                "url": "${BASE}/Flare_${VERSION}_aarch64.app.tar.gz"
              },
              "linux-x86_64": {
                "signature": "$(read_sig "flare_${VERSION}_amd64.AppImage.tar.gz.sig")",
                "url": "${BASE}/flare_${VERSION}_amd64.AppImage.tar.gz"
              },
              "windows-x86_64": {
                "signature": "$(read_sig "Flare_${VERSION}_x64-setup.nsis.zip.sig")",
                "url": "${BASE}/Flare_${VERSION}_x64-setup.exe"
              }
            }
          }
          EOF

      - name: Upload latest.json to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

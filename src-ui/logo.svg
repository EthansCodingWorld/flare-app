<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 125" fill="none">
  <defs>
    <linearGradient id="fg" x1="50" y1="5" x2="50" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#60e5ff"/>
      <stop offset="28%"  stop-color="#9b4dff"/>
      <stop offset="58%"  stop-color="#f02f8f"/>
      <stop offset="100%" stop-color="#e0173a"/>
    </linearGradient>
    <filter id="outerGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lineGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Soft ambient glow layer -->
  <path fill="url(#fg)" opacity="0.3" filter="url(#outerGlow)"
    d="M52 4 C63 24 78 27 73 50 C68 66 80 70 77 84 C72 100 55 118 36 110 C17 102 10 85 13 69 C16 56 8 50 12 36 C17 22 30 18 32 8 C39 20 41 33 38 46 C44 37 49 26 52 4Z"/>

  <!-- Flame fill -->
  <path fill="url(#fg)"
    d="M52 4 C63 24 78 27 73 50 C68 66 80 70 77 84 C72 100 55 118 36 110 C17 102 10 85 13 69 C16 56 8 50 12 36 C17 22 30 18 32 8 C39 20 41 33 38 46 C44 37 49 26 52 4Z"/>

  <!-- Neon white outline -->
  <path fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="2" stroke-linejoin="round" filter="url(#lineGlow)"
    d="M52 4 C63 24 78 27 73 50 C68 66 80 70 77 84 C72 100 55 118 36 110 C17 102 10 85 13 69 C16 56 8 50 12 36 C17 22 30 18 32 8 C39 20 41 33 38 46 C44 37 49 26 52 4Z"/>

  <!-- Inner swirl curl -->
  <path fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="1.8" stroke-linecap="round" filter="url(#lineGlow)"
    d="M44 62 C50 54 59 50 57 41 C55 32 46 30 42 37"/>
</svg>
